[project]
name = "Audio_Summary"
version = "0.1.0"
description = "A simple app that uses local/self-hosted LLMs to transcribe, diarize, and summarize audio conversations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "python-dotenv>=1.2.2",
    "requests>=2.31",
    "openai>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]
