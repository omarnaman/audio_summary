[project]
name = "asr-common"
version = "0.1.0"
description = "Shared ffmpeg conversion, pyannote diarization, and error/data types for audio_summary ASR services"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pyannote.audio>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
