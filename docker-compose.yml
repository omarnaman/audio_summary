services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in .env, e.g. postgresql+psycopg://audio_summary:<POSTGRES_PASSWORD>@postgres:5432/audio_summary}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - ASR_SERVICE_URL=${ASR_SERVICE_URL:-http://asr-service:8000}
      - ASR_SERVICE_API_KEY=${ASR_SERVICE_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  asr-service:
    build:
      context: ./asr_services
      dockerfile: linux/Dockerfile
    profiles: ["default-asr"]
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - DIARIZATION_MODEL=${DIARIZATION_MODEL:-pyannote/speaker-diarization-3.1}
      - API_KEY=${ASR_SERVICE_API_KEY}
    volumes:
      - hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    profiles: ["test"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=audio_summary
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=audio_summary
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audio_summary"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  hf_cache:
